[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "infurnace"
version = "0.0.0"
description = "Run a single LLM fast on your GPU with tinygrad"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tinygrad @ git+https://github.com/tinygrad/tinygrad@bc5a2d393bb37f819c6a87cc65b2c750c060c1cb",]

[project.optional-dependencies]
qwen35 = ["tokenizers>=0.22,<0.23"]
dev = ["ruff==0.14.10", "pytest", "jinja2"]

[project.scripts]
infurnace = "infurnace.cli:main"

[tool.setuptools]
packages = ["infurnace", "infurnace.eagle", "infurnace.dflash", "infurnace.kernels"]

[tool.ruff]
preview = true
target-version = "py311"
line-length = 150
indent-width = 2
exclude = [
  ".git/",
  "docs/",
  "models/",
  "infurnace.egg-info/",
]

[tool.ruff.lint]
select = [
  "F",  # Pyflakes
  "W6",
  "E71",
  "E72",
  "E112",   # no-indented-block
  "E113",   # unexpected-indentation
  "E203",   # whitespace-before-punctuation
  "E272",   # multiple-spaces-before-keyword
  "E275",   # missing-whitespace-after-keyword
  "E303",   # too-many-blank-lines
  "E304",   # blank-line-after-decorator
  "E501",   # line-too-long
  "E702",   # multiple-statements-on-one-line-semicolon
  "E703",   # useless-semicolon
  "E731",   # lambda-assignment
  "W191",   # tab-indentation
  "W291",   # trailing-whitespace
  "W293",   # blank-line-with-whitespace
  "UP039",  # unnecessary-class-parentheses
  "C416",   # unnecessary-comprehension
  "RET506", # superfluous-else-raise
  "RET507", # superfluous-else-continue
  "A",      # builtin-variable-shadowing, builtin-argument-shadowing, builtin-attribute-shadowing
  "FURB110",# if-exp-instead-of-or-operator
  "RUF018", # assignment-in-assert
]

[tool.ruff.format]
exclude = ["*"]